[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["src/worlds", "src/worlds-template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/backend"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["src/backend"]
asyncio_mode = "auto"
