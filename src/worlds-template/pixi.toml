[workspace]
name = "planworld-world"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.13.*"
nodejs = ">=22"
process-compose = "*"

[pypi-dependencies]
gymnasium = ">=1.0"
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }
mcp = ">=1.10,<2"  # FastMCP API; mcp 2.x renamed it to MCPServer
pytest = ">=8"
httpx = ">=0.27"

[tasks]
serve = "uvicorn server.api:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 2"
ui = { cmd = "test -d node_modules || npm install; npx vite --port 5173 --strictPort", cwd = "ui" }
test = "python -m pytest tests/backend"
build-ui = { cmd = "test -d node_modules || npm ci; npm run build", cwd = "ui" }
test-ui = { cmd = "test -d node_modules || npm ci; npx vitest run", cwd = "ui" }
dev = "process-compose up --no-server"  # no control port, so several worlds can run at once
