[project]
name = "planworldsimulator-backend"
version = "0.1.0"
description = "PlanWorldSimulator world generator backend."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite",
    "alembic",
    "fastapi",
    "httpx",
    "playwright",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn",
]

[project.scripts]
planworldsimulator-backend = "planworldsimulator_backend.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planworldsimulator_backend"]
