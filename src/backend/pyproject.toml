[project]
name = "planbench-backend"
version = "0.1.0"
description = "PlanBench world generator backend."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite",
    "alembic",
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn",
]

[project.scripts]
planbench-backend = "planbench_backend.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planbench_backend"]
