[project]
name = "planworldsimulator-harness"
version = "0.1.0"
description = "PlanWorldSimulator agent harness: plays a world through its MCP server."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-ai-slim[google,openai,mcp]",
    "uvicorn",
]

[project.scripts]
harness = "planworldsimulator_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planworldsimulator_harness"]
